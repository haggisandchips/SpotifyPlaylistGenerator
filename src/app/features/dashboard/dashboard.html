<div class="page">
  <header class="banner">
    <img src="brand-banner.svg" alt="Spotify Playlist Generator" class="banner-image" />

    @if (profile(); as user) {
      <div class="profile-panel">
        <div class="profile-info">
          @if (user.images?.length) {
            <img [src]="user.images[0].url" [alt]="user.display_name ?? user.id" class="avatar" />
          }
          <div class="profile-text">
            <p class="display-name">{{ user.display_name ?? user.id }}</p>
            <p class="email">{{ user.email }}</p>
            <p class="product">Spotify {{ user.product }}</p>
          </div>
        </div>
        <button type="button" class="btn btn-secondary" (click)="logout()">Log out</button>
      </div>
    }
  </header>

  <main class="content">
    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    } @else if (!profile()) {
      <p>Loading your Spotify profile…</p>
    }

    @if (profile(); as user) {
      <app-generator-panel
        [userId]="user.id"
        [market]="user.country"
        [selectedPlaylistId]="selectedPlaylistId()"
        [playlists]="playlists()"
        [playlistsError]="playlistsError()"
        [highlightPlaylistId]="highlightPlaylistId()"
        (playlistSelected)="onPlaylistSelected($event)"
        (wizardReset)="onWizardReset()"
        (playlistCreated)="onPlaylistCreated($event)"
        (tracksAdded)="onTracksAdded($event)"
      />
    }
  </main>
</div>
